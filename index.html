<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Májinka & Kubík | Anniversary Edition</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="custom-cursor"></div>


<div id="game">


    <!-- SCENE 01 : START MENU -->

    <section class="scene active" id="startScene">


        <div class="logo">

            <span>M</span>

            <span class="heart"></span>

            <span>K</span>

        </div>


        <h1>
            ANNIVERSARY EDITION
        </h1>


        <button id="startButton">
            PRESS START
        </button>


        <div class="version">
            v1.0
        </div>


    </section>





    <!-- SCENE 02 : SAVE SLOT -->


    <section class="scene" id="saveScene">


        <div class="save-card">


            <div class="save-header">

                SELECT SAVE FILE

            </div>



            <h2>
                SAVE SLOT 01
            </h2>



            <h3>
                💖 MÁJINKA & KUBÍK
            </h3>



            <div class="stats">


                <div class="stat">

                    <span>
                        PLAY TIME
                    </span>

                    <strong>
                        365 DAYS
                    </strong>

                </div>



                <div class="stat">

                    <span>
                        RELATIONSHIP STATUS
                    </span>

                    <strong>
                        TOGETHER ❤️
                    </strong>

                </div>




                <div class="stat">

                    <span>
                        DIFFICULTY
                    </span>

                    <strong>
                        SOULMATE
                    </strong>

                </div>



                <div class="stat">

                    <span>
                        COMPLETION
                    </span>

                    <strong>
                        0%
                    </strong>

                </div>


            </div>




            <div class="autosave">

                AUTOSAVE ENABLED

            </div>



            <button id="continueButton">

                CONTINUE

            </button>



        </div>



    </section>



</div>



<script src="script.js"></script>


</body>

</html>
