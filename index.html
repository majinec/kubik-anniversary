<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Májinka & Kubík ❤️ Anniversary Edition</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="boot-screen">


    <div class="ambient-glow"></div>


    <div class="ps-logo">
        M <span>💖</span> K
    </div>



    <div class="system-text">

        <p>PLAYSTATION 5</p>

        <h1>
            SYSTEM STARTING...
        </h1>

        <span>
            CHECKING MEMORY...
        </span>

    </div>



    <div class="loading-container">

        <div class="loading-line"></div>

    </div>




    <div class="player-select">


        <h2>
            PLAYER SELECT
        </h2>



        <div class="players">


            <div class="player-card">


                <div class="number">
                    PLAYER 1
                </div>


                <h3>
                    Májinka
                </h3>


                <p>
                    MAIN CHARACTER
                </p>


                <small>
                    ROLE: PLAYER ONE
                </small>


            </div>




            <div class="connection">

                +

                <span>
                    CO-OP
                </span>

            </div>





            <div class="player-card">


                <div class="number">
                    PLAYER 2
                </div>


                <h3>
                    Kubík
                </h3>


                <p>
                    MY FAVORITE PERSON
                </p>


                <small>
                    ROLE: PLAYER TWO
                </small>


            </div>


        </div>



        <div class="connected">

            CONNECTION ESTABLISHED

        </div>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
